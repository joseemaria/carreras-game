<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuito del Jarama</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
    touch-action: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Dimensiones del coche
  const carWidth = 40;
  const carHeight = 70;

  // Estado del coche (x,y = centro del coche EN COORDENADAS DE MUNDO;
  // angle en radianes, 0 = apuntando "hacia arriba" del mundo)
  const car = {
    x: 0,
    y: 0,
    angle: 0,
    velocity: 0
  };

  // Parámetros de movimiento
  const ACCELERATION = 0.22;   // aumento de velocidad por frame mientras se acelera
  const FRICTION = 0.985;      // al soltar, conserva el 98.5% (pierde solo un 1.5% por frame -> mucha inercia)
  const MAX_SPEED = 16;        // velocidad máxima (asfalto)
  const MIN_VELOCITY = 0.01;   // umbral para redondear a 0 y evitar decimales infinitos
  const TURN_SPEED = 0.045;    // radianes que gira el coche por frame (asfalto)

  // --- Física de arena/hierba (fuera de pista) ---
  // Al salirse del asfalto, el coche NO se bloquea ni se sanciona: simplemente
  // pierde un 60% de velocidad máxima y de agarre (dirección menos precisa,
  // sensación de derrape), pero siempre puede seguir avanzando.
  const OFFTRACK_GRIP_LOSS = 0.6;                    // -60% de agarre/velocidad máxima
  const OFFTRACK_MAX_SPEED = MAX_SPEED * (1 - OFFTRACK_GRIP_LOSS);
  const OFFTRACK_TURN_SPEED = TURN_SPEED * (1 - OFFTRACK_GRIP_LOSS);
  const OFFTRACK_FRICTION = 0.965;                   // algo más de resistencia a rodar sobre arena/hierba
  let isCarOffTrack = false;

  // Conversión de unidades de mundo a km/h para el velocímetro del HUD
  // (10 unidades de mundo ≈ 1 metro; velocity está en unidades/frame a 60fps)
  const WORLD_UNITS_PER_METER = 10;
  function velocityToKmh(velocity) {
    const metersPerSecond = (velocity * 60) / WORLD_UNITS_PER_METER;
    return metersPerSecond * 3.6;
  }

  // Punto y ángulo de partida: recta larga desde la meta, avanzando
  // hacia la derecha (heading = 90°). Aquí está la línea de meta.
  const START_X = 0;
  const START_Y = 0;
  const START_ANGLE = Math.PI / 2;

  const TRACK_WIDTH = 320; // ancho del asfalto (3-4 coches de sobra)
  const TOTAL_LAPS = 3;

  // El builder registra tanto el PATH real (para dibujar el asfalto) como
  // una lista de puntos muestreados (incluidos puntos a lo largo de cada
  // curva) que se usará tanto para el minimapa como para calcular la
  // distancia del coche al eje de la pista (detección de arena/hierba).
  function createTrackBuilder(startX, startY, startHeading) {
    let x = startX;
    let y = startY;
    let heading = startHeading;
    const path = new Path2D();
    path.moveTo(x, y);
    const points = [{ x, y }];

    return {
      forward(distance) {
        x += Math.sin(heading) * distance;
        y -= Math.cos(heading) * distance;
        path.lineTo(x, y);
        points.push({ x, y });
      },
      turnRight(radius, degrees) {
        const delta = degrees * Math.PI / 180;
        const cx = x + radius * Math.cos(heading);
        const cy = y + radius * Math.sin(heading);
        const a0 = heading + Math.PI;
        const a1 = a0 + delta;
        path.arc(cx, cy, radius, a0, a1, false);
        const steps = Math.max(4, Math.round(Math.abs(degrees) / 10));
        for (let i = 1; i <= steps; i++) {
          const a = a0 + (delta * i) / steps;
          points.push({ x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) });
        }
        heading += delta;
        x = cx + radius * Math.cos(a1);
        y = cy + radius * Math.sin(a1);
      },
      turnLeft(radius, degrees) {
        const delta = degrees * Math.PI / 180;
        const cx = x - radius * Math.cos(heading);
        const cy = y - radius * Math.sin(heading);
        const a0 = heading;
        const a1 = a0 - delta;
        path.arc(cx, cy, radius, a0, a1, true);
        const steps = Math.max(4, Math.round(Math.abs(degrees) / 10));
        for (let i = 1; i <= steps; i++) {
          const a = a0 - (delta * i) / steps;
          points.push({ x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) });
        }
        heading -= delta;
        x = cx + radius * Math.cos(a1);
        y = cy + radius * Math.sin(a1);
      },
      getPath() { return path; },
      getPoints() { return points; },
      state() { return { x, y, heading }; }
    };
  }

  // ===================================================================
  // CIRCUITO DEL JARAMA (Madrid) — reconstrucción estilizada
  // ===================================================================
  // Sentido horario. Curvas, en orden: Nuvolari + Fangio (pequeño quiebro
  // justo tras la meta), Varzi, Le Mans, Farina, Pegaso (+ rampa bajo el
  // puente), Ascari, Portago (frenada fuerte), las eses de Bugatti (aquí
  // como un lazo/gancho cerrado, tal como se aprecia en el plano de
  // referencia), Monza y, por último, María de Villota, que cierra el
  // circuito reconectando con la recta de meta. Los radios/longitudes
  // son una aproximación estilizada inspirada en la secuencia real y en
  // la silueta de la imagen de referencia (no un plano topográfico
  // milimétrico), ajustada para que el trazado cierre matemáticamente de
  // forma exacta sobre el punto de partida (comprobado numéricamente:
  // error de cierre del orden de 10⁻⁹).
  //
  // A lo largo de la construcción se capturan 3 checkpoints invisibles,
  // repartidos de forma aproximadamente equidistante por el trazado, que
  // el coche debe cruzar EN ORDEN (1 -> 2 -> 3) antes de que cruzar la
  // meta cuente como una vuelta válida.
  const trackBuilder = createTrackBuilder(START_X, START_Y, START_ANGLE);
  trackBuilder.forward(6881.210836435495);          // gran recta de meta
  trackBuilder.turnLeft(500, 20);                    // Nuvolari + Fangio (quiebro tras meta)
  trackBuilder.forward(700);
  trackBuilder.turnRight(400, 70);                   // Varzi
  trackBuilder.forward(500);
  trackBuilder.turnLeft(250, 55);                    // Le Mans
  trackBuilder.forward(400);
  trackBuilder.turnRight(350, 60);                   // Farina
  // --- Checkpoint 1 (~1/4 del trazado): justo después de Farina ---
  const checkpoint1State = trackBuilder.state();
  trackBuilder.forward(400);
  trackBuilder.turnLeft(400, 65);                    // Pegaso
  trackBuilder.forward(1500);                        // rampa Pegaso
  trackBuilder.turnRight(500, 85);                   // Ascari
  trackBuilder.forward(1200);
  trackBuilder.turnRight(250, 120);                  // Portago (frenada fuerte)
  trackBuilder.forward(11075.655938779739 / 2);
  // --- Checkpoint 2 (~mitad del trazado) ---
  const checkpoint2State = trackBuilder.state();
  trackBuilder.forward(11075.655938779739 / 2);
  trackBuilder.turnLeft(300, 80);                    // Bugatti 1 (lazo cerrado)
  trackBuilder.forward(250);
  trackBuilder.turnRight(250, 30);                   // Bugatti 2
  trackBuilder.forward(250);
  trackBuilder.turnLeft(300, 60);                    // Bugatti 3 (cierra el lazo)
  trackBuilder.forward(700);
  trackBuilder.turnRight(400, 75);                   // Monza 1
  // --- Checkpoint 3 (~3/4 del trazado): justo después de Monza 1 ---
  const checkpoint3State = trackBuilder.state();
  trackBuilder.forward(400);
  trackBuilder.turnRight(400, 110);                  // Monza 2
  trackBuilder.forward(800);
  trackBuilder.turnRight(600, 90);                   // María de Villota (cierra el circuito)
  const trackPath = trackBuilder.getPath();
  const trackPoints = trackBuilder.getPoints();

  // Caja delimitadora del trazado completo (en coordenadas de mundo), usada
  // para escalar el dibujo del minimapa.
  const trackBounds = trackPoints.reduce((acc, p) => ({
    minX: Math.min(acc.minX, p.x),
    maxX: Math.max(acc.maxX, p.x),
    minY: Math.min(acc.minY, p.y),
    maxY: Math.max(acc.maxY, p.y)
  }), { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity });

  // Línea de meta: un poco por delante del punto de partida, sobre la
  // primera recta. FINISH_FORWARD es la dirección de circulación en ese
  // punto y FINISH_PERP su perpendicular (para medir distancia lateral).
  const FINISH_DISTANCE_FROM_START = 250;
  const FINISH_X = START_X + Math.sin(START_ANGLE) * FINISH_DISTANCE_FROM_START;
  const FINISH_Y = START_Y - Math.cos(START_ANGLE) * FINISH_DISTANCE_FROM_START;
  const FINISH_FORWARD = { x: Math.sin(START_ANGLE), y: -Math.cos(START_ANGLE) };
  const FINISH_PERP = { x: Math.cos(START_ANGLE), y: Math.sin(START_ANGLE) };

  // -------------------------------------------------------------------
  // SISTEMA DE CHECKPOINTS (3 obligatorios, en orden, antes de la meta)
  // -------------------------------------------------------------------
  function makeCheckpoint(state) {
    return {
      x: state.x,
      y: state.y,
      forward: { x: Math.sin(state.heading), y: -Math.cos(state.heading) },
      perp: { x: Math.cos(state.heading), y: Math.sin(state.heading) },
      prevSignedPos: 0
    };
  }
  const CHECKPOINTS = [
    makeCheckpoint(checkpoint1State),
    makeCheckpoint(checkpoint2State),
    makeCheckpoint(checkpoint3State)
  ];
  let checkpointsPassed = [false, false, false];

  // -------------------------------------------------------------------
  // PAREDES INVISIBLES DE COLISIÓN SÓLIDA
  // -------------------------------------------------------------------
  // Bloquean físicamente cualquier abertura o desvío a la DERECHA de la
  // recta de meta, y el hueco justo detrás de la parrilla de salida, para
  // que sea imposible girar a la derecha o dar la vuelta y circular en
  // sentido contrario nada más salir. El coche rebota físicamente al
  // tocarlas (nunca se queda "pegado" ni frenado en seco).
  const GRID_BEHIND_DISTANCE = 400;   // pared trasera: distancia detrás de la parrilla
  const STRAIGHT_WALL_END = 6881.210836435495 - 300; // la pared lateral acaba justo antes de la 1ª curva
  const WALL_LATERAL_OFFSET = TRACK_WIDTH / 2 + 20;  // justo por fuera del piano, a la derecha

  function pointAlongStraight(t) {
    return {
      x: START_X + FINISH_FORWARD.x * t,
      y: START_Y + FINISH_FORWARD.y * t
    };
  }
  const gridBack = pointAlongStraight(-GRID_BEHIND_DISTANCE);
  const straightEnd = pointAlongStraight(STRAIGHT_WALL_END);

  const WALLS = [
    // Pared lateral derecha: recorre toda la recta de meta impidiendo
    // desviarse a la derecha del trazado oficial.
    {
      x1: gridBack.x + WALL_LATERAL_OFFSET * FINISH_PERP.x,
      y1: gridBack.y + WALL_LATERAL_OFFSET * FINISH_PERP.y,
      x2: straightEnd.x + WALL_LATERAL_OFFSET * FINISH_PERP.x,
      y2: straightEnd.y + WALL_LATERAL_OFFSET * FINISH_PERP.y
    },
    // Pared trasera: cierra el hueco justo detrás de la parrilla, para que
    // no se pueda dar la vuelta y salir marcha atrás del circuito.
    {
      x1: gridBack.x - WALL_LATERAL_OFFSET * FINISH_PERP.x,
      y1: gridBack.y - WALL_LATERAL_OFFSET * FINISH_PERP.y,
      x2: gridBack.x + WALL_LATERAL_OFFSET * FINISH_PERP.x,
      y2: gridBack.y + WALL_LATERAL_OFFSET * FINISH_PERP.y
    }
  ];

  const MEDIAN_WALLS = [
    // Bloque físico invisible en la mediana (interior de la última curva)
    // Se activa solo al tener 3/3 checkpoints para evitar el atajo final.
    { x1: 0, y1: WALL_LATERAL_OFFSET, x2: 3000, y2: WALL_LATERAL_OFFSET },     // Recta de meta
    { x1: -297, y1: 303, x2: 0, y2: WALL_LATERAL_OFFSET },                     // Curva María de Villota (mitad 2)
    { x1: -420, y1: 600, x2: -297, y2: 303 },                                  // Curva María de Villota (mitad 1)
    { x1: -420, y1: 1500, x2: -420, y2: 600 },                                 // Recta de retorno
    { x1: 3000, y1: WALL_LATERAL_OFFSET, x2: 3000, y2: 1500 },                 // Cierre este
    { x1: -420, y1: 1500, x2: 3000, y2: 1500 }                                 // Cierre sur
  ];

  const CHECKPOINT2_WALLS = [
    // Bloqueo transversal de la recta principal cuando se tienen 2/3 checkpoints.
    // Evita que el jugador gire a la derecha en la intersección y repita el primer sector,
    // o que vaya hacia la parrilla de salida por el camino equivocado.
    { x1: 6000, y1: -WALL_LATERAL_OFFSET, x2: 6000, y2: WALL_LATERAL_OFFSET }, // Bloqueo hacia adelante (curva 1)
    { x1: 400, y1: -WALL_LATERAL_OFFSET, x2: 400, y2: WALL_LATERAL_OFFSET }    // Bloqueo hacia atrás (parrilla)
  ];

  // --- Cámara (sigue al coche suavemente, tipo F1 on-board) ---
  const camera = { x: START_X, y: START_Y };
  const CAMERA_SMOOTH = 0.08; // 0 = cámara fija, 1 = cámara pegada al coche sin suavizado

  // --- Cronómetro y vueltas ---
  let raceStartTime = performance.now();
  let lapStartTime = performance.now();
  let currentLap = 1;
  let lastLapTime = null;   // en segundos, null hasta completar la 1ª vuelta
  let previousFinishSignedPos = 0;     // posición firmada respecto a la meta

  // --- Estado de controles (combinación de teclado + táctil) ---
  const keyboardState = { up: false, left: false, right: false };

  // Array global de toques activos: cada elemento es { identifier, x, y }.
  // Se actualiza directamente en los eventos touchstart/touchmove/touchend/touchcancel.
  let activeTouches = [];

  // Ajustar el canvas al tamaño completo de la ventana (no afecta al coche,
  // que vive en coordenadas de mundo independientes de la pantalla)
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // Posición firmada de un punto respecto a una referencia (con su propia
  // dirección "forward"), medida a lo largo de esa dirección de
  // circulación. Negativa = por detrás de la referencia, positiva = por
  // delante. Se usa tanto para la meta como para los checkpoints.
  function signedPositionAlong(px, py, refX, refY, forward) {
    return (px - refX) * forward.x + (py - refY) * forward.y;
  }

  // Punto más cercano a (px,py) sobre el segmento [a,b]. Se usa tanto para
  // la detección de arena/hierba (distancia al eje de la pista) como para
  // la colisión con las paredes invisibles.
  function closestPointOnSegment(px, py, ax, ay, bx, by) {
    const abx = bx - ax;
    const aby = by - ay;
    const abLenSq = abx * abx + aby * aby;
    let t = abLenSq > 0 ? ((px - ax) * abx + (py - ay) * aby) / abLenSq : 0;
    t = Math.max(0, Math.min(1, t));
    return { x: ax + abx * t, y: ay + aby * t };
  }

  // Distancia del coche al eje central del trazado (usando la polilínea
  // muestreada trackPoints). Si supera TRACK_WIDTH/2, el coche está fuera
  // del asfalto (arena/hierba).
  function distanceToTrackCenterline(px, py) {
    let minDist = Infinity;
    for (let i = 0; i < trackPoints.length - 1; i++) {
      const a = trackPoints[i];
      const b = trackPoints[i + 1];
      const cp = closestPointOnSegment(px, py, a.x, a.y, b.x, b.y);
      const d = Math.hypot(px - cp.x, py - cp.y);
      if (d < minDist) minDist = d;
    }
    return minDist;
  }

  // Resuelve colisiones contra las paredes invisibles: si el coche invade
  // una pared, lo empuja fuera de ella y refleja físicamente la componente
  // de velocidad normal al muro (rebote real, no un simple "stop").
  const WALL_COLLISION_RADIUS = carWidth / 2 + 6;
  const WALL_BOUNCE = 0.5; // factor de restitución del rebote
  const WALLS_UNLOCK_CHECKPOINTS = 2; // nº de checkpoints (de 3) a partir del cual se abre la barrera

  // La barrera solo está activa (sólida) al PRINCIPIO de la vuelta, mientras
  // el coche todavía no ha acumulado los checkpoints necesarios. En cuanto
  // se alcanza el penúltimo checkpoint (2/3), se considera que el coche ya
  // ha completado el trazado oficial y va camino de la meta, así que el
  // tramo se abre automáticamente para dejarle pasar y cruzar la línea.
  // Al cruzar la meta los checkpoints se resetean a 0/3 (ver
  // checkLapCrossing), lo que vuelve a cerrar la barrera para la vuelta
  // siguiente sin necesidad de ningún código adicional aquí.
  function resolveWallCollisions() {
    const passedCount = checkpointsPassed.filter(Boolean).length;
    const startWallsActive = passedCount < WALLS_UNLOCK_CHECKPOINTS;
    const loopWallsActive = passedCount === 2;
    const medianWallsActive = passedCount === 3;

    if (!startWallsActive && !medianWallsActive && !loopWallsActive) return;

    let activeWalls = [];
    if (startWallsActive) activeWalls = activeWalls.concat(WALLS);
    if (loopWallsActive) activeWalls = activeWalls.concat(CHECKPOINT2_WALLS);
    if (medianWallsActive) activeWalls = activeWalls.concat(MEDIAN_WALLS);

    for (const wall of activeWalls) {
      const cp = closestPointOnSegment(car.x, car.y, wall.x1, wall.y1, wall.x2, wall.y2);
      let dx = car.x - cp.x;
      let dy = car.y - cp.y;
      let dist = Math.hypot(dx, dy);
      if (dist < WALL_COLLISION_RADIUS) {
        if (dist < 0.0001) { dx = 1; dy = 0; dist = 1; }
        const nx = dx / dist;
        const ny = dy / dist;
        const penetration = WALL_COLLISION_RADIUS - dist;
        car.x += nx * penetration;
        car.y += ny * penetration;

        const vx = Math.sin(car.angle) * car.velocity;
        const vy = -Math.cos(car.angle) * car.velocity;
        const vDotN = vx * nx + vy * ny;
        if (vDotN < 0) { // solo rebota si se mueve HACIA la pared
          const rvx = vx - (1 + WALL_BOUNCE) * vDotN * nx;
          const rvy = vy - (1 + WALL_BOUNCE) * vDotN * ny;
          const newSpeed = Math.hypot(rvx, rvy);
          if (newSpeed > 0.001) {
            car.angle = Math.atan2(rvx, -rvy);
          }
          car.velocity = Math.min(newSpeed, MAX_SPEED);
        }
      }
    }
  }

  // Coloca el coche en la parrilla de salida
  function initCar() {
    car.x = START_X;
    car.y = START_Y;
    car.angle = START_ANGLE;
    car.velocity = 0;
    camera.x = START_X;
    camera.y = START_Y;
    previousFinishSignedPos = signedPositionAlong(START_X, START_Y, FINISH_X, FINISH_Y, FINISH_FORWARD);
    CHECKPOINTS.forEach(cp => {
      cp.prevSignedPos = signedPositionAlong(START_X, START_Y, cp.x, cp.y, cp.forward);
    });
    checkpointsPassed = [false, false, false];
  }

  // Zonas de control (se dibujan como guía visual provisional):
  //   - Acelerar ("Gas"): X > 70% del ancho, Y < 40% del alto (esquina superior derecha)
  //   - Girar Izquierda: X < 50% del ancho
  //   - Girar Derecha: X > 50% del ancho y Y > 40% del alto
  const ACCEL_ZONE_X_RATIO = 0.7;
  const ACCEL_ZONE_Y_RATIO = 0.4;
  const TURN_ZONE_X_RATIO = 0.5;
  const RIGHT_ZONE_Y_RATIO = 0.4;

  // Evalúa, a partir del array global de toques activos, qué controles
  // táctiles están pulsados EN ESTE FRAME. Se llama desde update().
  function evaluateTouchControls() {
    const w = window.innerWidth;
    const h = window.innerHeight;

    let accelerate = false;
    let left = false;
    let right = false;

    for (const touch of activeTouches) {
      if (touch.x > w * ACCEL_ZONE_X_RATIO && touch.y < h * ACCEL_ZONE_Y_RATIO) {
        accelerate = true;
      } else if (touch.x < w * TURN_ZONE_X_RATIO) {
        left = true;
      } else if (touch.x > w * TURN_ZONE_X_RATIO && touch.y > h * RIGHT_ZONE_Y_RATIO) {
        right = true;
      }
    }

    return { accelerate, left, right };
  }

  // Comprueba si el coche acaba de cruzar cada checkpoint avanzando en el
  // sentido correcto. Solo se marca como superado el checkpoint N si ya se
  // superó el checkpoint N-1 (obliga al orden 1 -> 2 -> 3). Si el coche
  // recula sobre un checkpoint ya superado, se anula (hay que volver a
  // pasarlo hacia delante, y también los siguientes en su momento).
  function checkCheckpointsCrossing() {
    CHECKPOINTS.forEach((cp, i) => {
      const signedPos = signedPositionAlong(car.x, car.y, cp.x, cp.y, cp.forward);
      const lateralOffset = signedPositionAlong(car.x, car.y, cp.x, cp.y, cp.perp);
      const withinTrack = Math.abs(lateralOffset) < TRACK_WIDTH / 2;

      if (withinTrack) {
        if (cp.prevSignedPos < 0 && signedPos >= 0) {
          if (i === 0 || checkpointsPassed[i - 1]) {
            checkpointsPassed[i] = true; // cruzado hacia delante y en orden
          }
        } else if (cp.prevSignedPos >= 0 && signedPos < 0 && checkpointsPassed[i]) {
          checkpointsPassed[i] = false; // ha reculado sobre el checkpoint
        }
      }

      cp.prevSignedPos = signedPos;
    });
  }

  // Comprueba si el coche acaba de cruzar la línea de meta en el sentido
  // de circulación correcto (proyección sobre FINISH_FORWARD pasa de
  // negativa a positiva) estando dentro del ancho de la pista. Solo cuenta
  // como vuelta si además ya se han pasado los 3 checkpoints EN ORDEN
  // (evita que cuente al arrancar, al girar a la derecha, o si el coche
  // recula/da la vuelta sobre la meta).
  function checkLapCrossing() {
    checkCheckpointsCrossing();

    const signedPos = signedPositionAlong(car.x, car.y, FINISH_X, FINISH_Y, FINISH_FORWARD);
    const lateralOffset = signedPositionAlong(car.x, car.y, FINISH_X, FINISH_Y, FINISH_PERP);

    const crossedForward = previousFinishSignedPos < 0 && signedPos >= 0;
    const withinTrack = Math.abs(lateralOffset) < TRACK_WIDTH / 2;
    const allCheckpointsPassed = checkpointsPassed.every(Boolean);

    if (crossedForward && withinTrack && allCheckpointsPassed) {
      const now = performance.now();
      lastLapTime = (now - lapStartTime) / 1000;
      lapStartTime = now;
      if (currentLap < TOTAL_LAPS) {
        currentLap++;
      }
      checkpointsPassed = [false, false, false]; // hay que volver a pasar los 3 para la próxima vuelta
    }

    previousFinishSignedPos = signedPos;
  }

  // Actualiza la física del coche (aceleración / fricción / rotación),
  // aplicando pérdida de agarre si está fuera de pista (arena/hierba) y
  // resolviendo el rebote contra las paredes invisibles.
  function update() {
    const touch = evaluateTouchControls();

    const accelerating = keyboardState.up || touch.accelerate;
    const turningLeft = keyboardState.left || touch.left;
    const turningRight = keyboardState.right || touch.right;

    // --- Detección de superficie: asfalto o arena/hierba ---
    const distFromCenter = distanceToTrackCenterline(car.x, car.y);
    isCarOffTrack = distFromCenter > TRACK_WIDTH / 2;

    const currentMaxSpeed = isCarOffTrack ? OFFTRACK_MAX_SPEED : MAX_SPEED;
    const currentTurnSpeed = isCarOffTrack ? OFFTRACK_TURN_SPEED : TURN_SPEED;
    const currentFriction = isCarOffTrack ? OFFTRACK_FRICTION : FRICTION;

    if (accelerating) {
      car.velocity += ACCELERATION;
      if (car.velocity > currentMaxSpeed) car.velocity = currentMaxSpeed;
    } else {
      car.velocity *= currentFriction;
      if (Math.abs(car.velocity) < MIN_VELOCITY) car.velocity = 0;
    }

    // Si el coche entra en la arena/hierba yendo más rápido que el nuevo
    // límite de velocidad, no se frena en seco: pierde velocidad de forma
    // progresiva (sensación de derrape), pero SIEMPRE puede seguir avanzando.
    if (car.velocity > currentMaxSpeed) {
      car.velocity += (currentMaxSpeed - car.velocity) * 0.06;
    }

    // Solo tiene sentido girar si el coche se está moviendo
    if (car.velocity !== 0) {
      if (turningLeft) car.angle -= currentTurnSpeed;
      if (turningRight) car.angle += currentTurnSpeed;
    }

    // El coche avanza en la dirección hacia la que apunta (angle 0 = "arriba" del mundo)
    car.x += Math.sin(car.angle) * car.velocity;
    car.y -= Math.cos(car.angle) * car.velocity;

    // Paredes invisibles: rebote físico si intenta desviarse a la derecha
    // de la recta de meta o dar la vuelta detrás de la parrilla.
    resolveWallCollisions();

    // Cámara: sigue al coche con suavizado (interpolación lineal)
    camera.x += (car.x - camera.x) * CAMERA_SMOOTH;
    camera.y += (car.y - camera.y) * CAMERA_SMOOTH;

    checkLapCrossing();
  }

  // Dibuja las 3 zonas táctiles como recuadros semitransparentes con texto guía
  // (se dibuja en espacio de PANTALLA, no de mundo, así que no se ve afectado por la cámara)
  function drawTouchZones() {
    const w = canvas.width;
    const h = canvas.height;

    ctx.save();
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Zona "Gas": X > 70%, Y < 40% (esquina superior derecha)
    const accelX = w * ACCEL_ZONE_X_RATIO;
    const accelW = w - accelX;
    const accelH = h * ACCEL_ZONE_Y_RATIO;
    ctx.fillStyle = 'rgba(76, 201, 240, 0.2)';
    ctx.fillRect(accelX, 0, accelW, accelH);
    ctx.strokeStyle = 'rgba(76, 201, 240, 0.6)';
    ctx.strokeRect(accelX, 0, accelW, accelH);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillText('Gas', accelX + accelW / 2, accelH / 2);

    // Zona "Girar Izq": X < 50%, alto completo
    const leftW = w * TURN_ZONE_X_RATIO;
    ctx.fillStyle = 'rgba(247, 127, 0, 0.15)';
    ctx.fillRect(0, 0, leftW, h);
    ctx.strokeStyle = 'rgba(247, 127, 0, 0.5)';
    ctx.strokeRect(0, 0, leftW, h);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillText('Girar Izq', leftW / 2, h / 2);

    // Zona "Girar Der": X > 50%, Y > 40%
    const rightX = w * TURN_ZONE_X_RATIO;
    const rightY = h * RIGHT_ZONE_Y_RATIO;
    const rightW = w - rightX;
    const rightH = h - rightY;
    ctx.fillStyle = 'rgba(144, 190, 109, 0.15)';
    ctx.fillRect(rightX, rightY, rightW, rightH);
    ctx.strokeStyle = 'rgba(144, 190, 109, 0.5)';
    ctx.strokeRect(rightX, rightY, rightW, rightH);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    ctx.fillText('Girar Der', rightX + rightW / 2, rightY + rightH / 2);

    ctx.restore();
  }

  // Dibuja el coche: deportivo visto desde arriba (ruedas, carrocería,
  // parabrisas, alerón). Todo se dibuja en coordenadas locales centradas
  // en (0,0), con el frente apuntando hacia -y; luego se traslada/rota
  // según la posición y el ángulo reales del coche EN EL MUNDO (el
  // llamador ya habrá aplicado el desplazamiento de cámara antes de esto).
  function drawCar() {
    const w = carWidth;
    const h = carHeight;
    const halfW = w / 2;
    const halfH = h / 2;

    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    // --- Ruedas (negras, debajo de la carrocería) ---
    const wheelW = 7;
    const wheelH = 16;
    ctx.fillStyle = '#0d0d0d';
    ctx.fillRect(-halfW - wheelW / 2 + 3, -halfH + 6, wheelW, wheelH);          // delantera izq.
    ctx.fillRect(halfW - wheelW / 2 - 3, -halfH + 6, wheelW, wheelH);           // delantera der.
    ctx.fillRect(-halfW - wheelW / 2 + 3, halfH - wheelH - 8, wheelW, wheelH);  // trasera izq.
    ctx.fillRect(halfW - wheelW / 2 - 3, halfH - wheelH - 8, wheelW, wheelH);   // trasera der.

    // --- Alerón trasero ---
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-halfW + 6, halfH - 11, 4, 8);   // soporte izq.
    ctx.fillRect(halfW - 10, halfH - 11, 4, 8);   // soporte der.
    ctx.fillRect(-halfW + 1, halfH - 6, w - 2, 5); // ala del alerón

    // --- Carrocería (rectángulo con esquinas redondeadas) ---
    const r = 9;
    ctx.beginPath();
    ctx.moveTo(-halfW + r, -halfH);
    ctx.lineTo(halfW - r, -halfH);
    ctx.quadraticCurveTo(halfW, -halfH, halfW, -halfH + r);
    ctx.lineTo(halfW, halfH - r);
    ctx.quadraticCurveTo(halfW, halfH, halfW - r, halfH);
    ctx.lineTo(-halfW + r, halfH);
    ctx.quadraticCurveTo(-halfW, halfH, -halfW, halfH - r);
    ctx.lineTo(-halfW, -halfH + r);
    ctx.quadraticCurveTo(-halfW, -halfH, -halfW + r, -halfH);
    ctx.closePath();

    const bodyGradient = ctx.createLinearGradient(0, -halfH, 0, halfH);
    bodyGradient.addColorStop(0, '#ff4d5e');
    bodyGradient.addColorStop(1, '#c1121f');
    ctx.fillStyle = bodyGradient;
    ctx.fill();
    ctx.strokeStyle = '#7a0a12';
    ctx.lineWidth = 2;
    ctx.stroke();

    // --- Franja central deportiva ---
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.fillRect(-3, -halfH + 5, 6, h - 10);

    // --- Parabrisas (trapecio cerca del frente, frente = -y) ---
    ctx.beginPath();
    ctx.moveTo(-halfW * 0.55, -halfH * 0.6);
    ctx.lineTo(halfW * 0.55, -halfH * 0.6);
    ctx.lineTo(halfW * 0.35, -halfH * 0.1);
    ctx.lineTo(-halfW * 0.35, -halfH * 0.1);
    ctx.closePath();
    ctx.fillStyle = 'rgba(140, 205, 230, 0.85)';
    ctx.fill();
    ctx.strokeStyle = '#2b2b2b';
    ctx.lineWidth = 1;
    ctx.stroke();

    // --- Faros delanteros ---
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.arc(-halfW * 0.6, -halfH + 4, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(halfW * 0.6, -halfH + 4, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Dibuja el terreno exterior (arena/hierba) que rodea el asfalto, en
  // coordenadas de MUNDO, cubriendo únicamente la zona visible según la
  // cámara actual (con margen), para que se desplace de forma natural
  // junto con el circuito.
  function drawGround(offsetX, offsetY) {
    const viewLeft = -offsetX - 200;
    const viewTop = -offsetY - 200;
    const viewRight = canvas.width - offsetX + 200;
    const viewBottom = canvas.height - offsetY + 200;

    ctx.fillStyle = '#33532f';
    ctx.fillRect(viewLeft, viewTop, viewRight - viewLeft, viewBottom - viewTop);

    // Rayas de césped cortado (tono muy sutil), ancladas al mundo para dar
    // sensación de movimiento real al circular por la arena/hierba.
    const stripeWidth = 160;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.035)';
    const startStripe = Math.floor(viewLeft / stripeWidth) * stripeWidth;
    for (let sx = startStripe; sx < viewRight; sx += stripeWidth * 2) {
      ctx.fillRect(sx, viewTop, stripeWidth, viewBottom - viewTop);
    }
  }

  // Dibuja el circuito completo en coordenadas de MUNDO: asfalto ancho,
  // pianos rojo/blanco en ambos bordes (siguiendo cada curva) y línea de meta.
  function drawTrack() {
    const curbExtra = 14; // cuánto sobresale el piano a cada lado del asfalto
    const dash = 90;      // longitud de cada segmento rojo/blanco del piano

    // 1) Capa de pianos: se traza MÁS ANCHA que el asfalto, con un patrón
    //    de guiones blanco/rojo alternados a lo largo de todo el trazado.
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = TRACK_WIDTH + curbExtra * 2;
    ctx.setLineDash([dash, dash]);
    ctx.lineDashOffset = 0;
    ctx.strokeStyle = '#f1f1f1';
    ctx.stroke(trackPath);
    ctx.lineDashOffset = dash;
    ctx.strokeStyle = '#e63946';
    ctx.stroke(trackPath);
    ctx.restore();

    // 2) Asfalto por encima, más estrecho: solo deja ver el piano en los bordes
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = TRACK_WIDTH;
    ctx.strokeStyle = '#3d3d3d';
    ctx.stroke(trackPath);
    ctx.restore();

    // 3) Línea de meta a cuadros, sobre la primera recta
    drawFinishLine();
  }

  // Dibuja la línea de meta (patrón de cuadros) en coordenadas de MUNDO,
  // orientada perpendicular a la dirección de circulación en ese punto:
  // ancha a lo largo de TODO el ancho de la pista (eje lateral) y fina en
  // el sentido de circulación, para que se vea como una línea horizontal
  // cruzando la recta principal de lado a lado.
  function drawFinishLine() {
    const lineDepth = 26; // grosor de la línea en el sentido de circulación
    const cols = 10;      // divisiones a lo ancho de la pista
    const rows = 3;       // divisiones en el grosor de la línea
    const cellW = TRACK_WIDTH / cols;
    const cellH = lineDepth / rows;

    ctx.save();
    ctx.translate(FINISH_X, FINISH_Y);
    ctx.rotate(START_ANGLE);

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const isBlack = (row + col) % 2 === 0;
        ctx.fillStyle = isBlack ? '#111111' : '#f5f5f5';
        ctx.fillRect(-TRACK_WIDTH / 2 + col * cellW, -lineDepth / 2 + row * cellH, cellW, cellH);
      }
    }

    ctx.restore();
  }

  // Convierte segundos -> "MM:SS.d"
  function formatTime(totalSeconds) {
    if (totalSeconds === null || totalSeconds === undefined) return '--:--.-';
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = Math.floor(totalSeconds % 60);
    const tenths = Math.floor((totalSeconds * 10) % 10);
    return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0') + '.' + tenths;
  }

  // HUD: velocidad, tiempo total, vuelta actual, tiempo de la última
  // vuelta, progreso de checkpoints y superficie actual (asfalto/arena).
  // Se dibuja en espacio de PANTALLA (esquina superior izquierda), sin
  // que le afecte la cámara ni el desplazamiento del mundo.
  const HUD_MARGIN = 12;
  const HUD_PADDING_X = 16;
  const HUD_PADDING_Y = 12;
  const HUD_LINE_HEIGHT = 24;
  const HUD_LINE_COUNT = 6; // velocidad, tiempo total, vuelta, última vuelta, checkpoints, superficie
  const HUD_BOX_WIDTH = 230;
  const HUD_BOX_HEIGHT = HUD_PADDING_Y * 2 + HUD_LINE_HEIGHT * HUD_LINE_COUNT;

  function drawHUD() {
    const totalTime = (performance.now() - raceStartTime) / 1000;
    const speedKmh = Math.round(velocityToKmh(car.velocity));
    const checkpointsCount = checkpointsPassed.filter(Boolean).length;

    const lines = [
      'Velocidad: ' + speedKmh + ' km/h',
      'Tiempo Total: ' + formatTime(totalTime),
      'Vuelta: ' + currentLap + '/' + TOTAL_LAPS,
      'Última vuelta: ' + formatTime(lastLapTime),
      'Checkpoints: ' + checkpointsCount + '/3',
      'Superficie: ' + (isCarOffTrack ? 'Arena/Hierba' : 'Asfalto')
    ];

    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(HUD_MARGIN, HUD_MARGIN, HUD_BOX_WIDTH, HUD_BOX_HEIGHT);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.strokeRect(HUD_MARGIN, HUD_MARGIN, HUD_BOX_WIDTH, HUD_BOX_HEIGHT);

    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';

    lines.forEach((line, i) => {
      // La línea de superficie cambia de color según si está en arena o asfalto
      if (i === 5) {
        ctx.fillStyle = isCarOffTrack ? '#e0c341' : '#8fd694';
      } else {
        ctx.fillStyle = '#f1f1f1';
      }
      ctx.fillText(line, HUD_MARGIN + HUD_PADDING_X, HUD_MARGIN + HUD_PADDING_Y + HUD_LINE_HEIGHT * i + HUD_LINE_HEIGHT / 2);
    });

    ctx.restore();
  }

  // Minimapa (radar): recuadro semitransparente en la esquina superior
  // IZQUIERDA, justo debajo del HUD (velocidad y tiempos), con el trazado
  // completo a escala reducida y un punto rojo brillante marcando la
  // posición del coche en tiempo real.
  const MINIMAP_SIZE = 170;
  const MINIMAP_PADDING = 14;
  const MINIMAP_GAP_BELOW_HUD = 12;

  function drawMinimap() {
    const boxX = HUD_MARGIN;
    const boxY = HUD_MARGIN + HUD_BOX_HEIGHT + MINIMAP_GAP_BELOW_HUD;

    ctx.save();

    // Fondo semitransparente del recuadro
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(boxX, boxY, MINIMAP_SIZE, MINIMAP_SIZE);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.strokeRect(boxX, boxY, MINIMAP_SIZE, MINIMAP_SIZE);

    // Recorta el resto del dibujo al recuadro
    ctx.beginPath();
    ctx.rect(boxX, boxY, MINIMAP_SIZE, MINIMAP_SIZE);
    ctx.clip();

    const trackW = trackBounds.maxX - trackBounds.minX;
    const trackH = trackBounds.maxY - trackBounds.minY;
    const available = MINIMAP_SIZE - MINIMAP_PADDING * 2;
    const scale = Math.min(available / trackW, available / trackH);

    const centerWorldX = (trackBounds.minX + trackBounds.maxX) / 2;
    const centerWorldY = (trackBounds.minY + trackBounds.maxY) / 2;

    function worldToMinimap(px, py) {
      return {
        x: boxX + MINIMAP_SIZE / 2 + (px - centerWorldX) * scale,
        y: boxY + MINIMAP_SIZE / 2 + (py - centerWorldY) * scale
      };
    }

    // Trazado completo simplificado (misma forma exacta que el circuito real)
    ctx.beginPath();
    trackPoints.forEach((p, i) => {
      const m = worldToMinimap(p.x, p.y);
      if (i === 0) ctx.moveTo(m.x, m.y);
      else ctx.lineTo(m.x, m.y);
    });
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Marca de la línea de meta
    const finishM = worldToMinimap(FINISH_X, FINISH_Y);
    ctx.fillStyle = '#4cc9f0';
    ctx.beginPath();
    ctx.arc(finishM.x, finishM.y, 3, 0, Math.PI * 2);
    ctx.fill();

    // Marcas de los 3 checkpoints (verde si superado, gris si pendiente)
    CHECKPOINTS.forEach((cp, i) => {
      const m = worldToMinimap(cp.x, cp.y);
      ctx.fillStyle = checkpointsPassed[i] ? '#57cc99' : 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Punto brillante del coche (posición en tiempo real)
    const carM = worldToMinimap(car.x, car.y);
    ctx.shadowColor = '#ff3b30';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff3b30';
    ctx.beginPath();
    ctx.arc(carM.x, carM.y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Dibuja fondo, terreno, circuito (con cámara F1 que sigue al coche),
  // zonas táctiles, minimapa y HUD.
  function draw() {
    // Fondo oscuro de respaldo (por si algún borde queda sin cubrir)
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- Mundo (terreno + circuito + coche), desplazado según la cámara ---
    const offsetX = canvas.width / 2 - camera.x;
    const offsetY = canvas.height / 2 - camera.y;

    ctx.save();
    ctx.translate(offsetX, offsetY);
    drawGround(offsetX, offsetY);
    drawTrack();
    drawCar();
    ctx.restore();

    // --- Pantalla (HUD, minimapa y zonas táctiles), sin transformar ---
    drawTouchZones();
    drawMinimap();
    drawHUD();
  }

  // Bucle principal del juego
  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // --- Controles de teclado ---
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      keyboardState.up = true;
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keyboardState.left = true;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyboardState.right = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      keyboardState.up = false;
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keyboardState.left = false;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyboardState.right = false;
    }
  });

  // --- Controles táctiles (multitouch) ---
  // El array activeTouches se mantiene sincronizado con los dedos reales
  // sobre la pantalla en cada uno de estos 4 eventos. La evaluación de
  // zonas ocurre aparte, en evaluateTouchControls(), dentro de update().

  function upsertTouch(touch) {
    const existing = activeTouches.find(t => t.identifier === touch.identifier);
    if (existing) {
      existing.x = touch.clientX;
      existing.y = touch.clientY;
    } else {
      activeTouches.push({
        identifier: touch.identifier,
        x: touch.clientX,
        y: touch.clientY
      });
    }
  }

  function removeTouch(touch) {
    activeTouches = activeTouches.filter(t => t.identifier !== touch.identifier);
  }

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      upsertTouch(touch);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      upsertTouch(touch);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      removeTouch(touch);
    }
  }, { passive: false });

  canvas.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      removeTouch(touch);
    }
  }, { passive: false });

  window.addEventListener('resize', resizeCanvas);

  // Inicializar
  resizeCanvas();
  initCar();
  gameLoop();
</script>
</body>
</html>
