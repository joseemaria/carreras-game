<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de Carreras</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #111;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Dimensiones del coche
  const carWidth = 40;
  const carHeight = 70;

  // Estado del coche (x,y = centro del coche; angle en radianes, 0 = apuntando hacia arriba)
  const car = {
    x: 0,
    y: 0,
    angle: 0,
    velocity: 0
  };

  // Parámetros de movimiento
  const ACCELERATION = 0.15;   // aumento de velocidad por frame mientras se acelera
  const FRICTION = 0.9;        // al soltar, conserva el 90% (pierde un 10%)
  const MAX_SPEED = 8;         // velocidad máxima
  const MIN_VELOCITY = 0.01;   // umbral para redondear a 0 y evitar decimales infinitos
  const TURN_SPEED = 0.045;    // radianes que gira el coche por frame

  // --- Estado de controles (combinación de teclado + táctil) ---
  const keyboardState = { up: false, left: false, right: false };
  const touchState = { accelerate: false, left: false, right: false };

  function isTouchAccelerating() { return touchState.accelerate; }
  function isTouchTurningLeft() { return touchState.left; }
  function isTouchTurningRight() { return touchState.right; }

  // Ajustar el canvas al tamaño completo de la ventana
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    // Centrar el coche horizontalmente y colocarlo en la parte inferior
    car.x = canvas.width / 2;
    car.y = canvas.height - carHeight - 40;
  }

  // Actualiza la física del coche (aceleración / fricción / rotación)
  function update() {
    const accelerating = keyboardState.up || isTouchAccelerating();
    const turningLeft = keyboardState.left || isTouchTurningLeft();
    const turningRight = keyboardState.right || isTouchTurningRight();

    if (accelerating) {
      car.velocity += ACCELERATION;
      if (car.velocity > MAX_SPEED) car.velocity = MAX_SPEED;
    } else {
      car.velocity *= FRICTION;
      if (Math.abs(car.velocity) < MIN_VELOCITY) car.velocity = 0;
    }

    // Solo tiene sentido girar si el coche se está moviendo
    if (car.velocity !== 0) {
      if (turningLeft) car.angle -= TURN_SPEED;
      if (turningRight) car.angle += TURN_SPEED;
    }

    // El coche avanza en la dirección hacia la que apunta (angle 0 = hacia arriba)
    car.x += Math.sin(car.angle) * car.velocity;
    car.y -= Math.cos(car.angle) * car.velocity;
  }

  // Dibuja el fondo oscuro y el coche (rotado según su ángulo)
  function draw() {
    // Fondo oscuro
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Coche
    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);
    ctx.fillStyle = '#e63946';
    ctx.fillRect(-carWidth / 2, -carHeight / 2, carWidth, carHeight);
    ctx.restore();
  }

  // Bucle principal del juego
  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // --- Controles de teclado ---
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      keyboardState.up = true;
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keyboardState.left = true;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyboardState.right = true;
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      keyboardState.up = false;
    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
      keyboardState.left = false;
    } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
      keyboardState.right = false;
    }
  });

  // --- Controles táctiles (multitouch) ---
  // Zonas de control (invisibles por ahora):
  //   - Acelerar: esquina superior derecha (30% ancho x 30% alto)
  //   - Girar izquierda: mitad izquierda de la pantalla (alto completo)
  //   - Girar derecha: mitad derecha, mitad inferior de la pantalla
  const CONTROL_ZONE_WIDTH_RATIO = 0.3;
  const CONTROL_ZONE_HEIGHT_RATIO = 0.3;

  // Recorre TODOS los dedos activos (e.touches) y recalcula qué zonas
  // están siendo pulsadas en este instante. Esto permite, por ejemplo,
  // acelerar con un dedo y girar con otro al mismo tiempo.
  function updateTouchControls(touches) {
    const w = window.innerWidth;
    const h = window.innerHeight;

    let accelerate = false;
    let left = false;
    let right = false;

    for (let i = 0; i < touches.length; i++) {
      const touch = touches[i];

      const inAccelZone =
        touch.clientX >= w * (1 - CONTROL_ZONE_WIDTH_RATIO) &&
        touch.clientY <= h * CONTROL_ZONE_HEIGHT_RATIO;

      if (inAccelZone) {
        accelerate = true;
      } else if (touch.clientX < w / 2) {
        left = true;
      } else if (touch.clientX >= w / 2 && touch.clientY >= h / 2) {
        right = true;
      }
    }

    touchState.accelerate = accelerate;
    touchState.left = left;
    touchState.right = right;
  }

  function handleTouchEvent(e) {
    e.preventDefault(); // evita zoom / scroll del navegador al tocar
    updateTouchControls(e.touches); // e.touches = todos los dedos actualmente en pantalla
  }

  canvas.addEventListener('touchstart', handleTouchEvent, { passive: false });
  canvas.addEventListener('touchmove', handleTouchEvent, { passive: false });
  canvas.addEventListener('touchend', handleTouchEvent, { passive: false });
  canvas.addEventListener('touchcancel', handleTouchEvent, { passive: false });

  window.addEventListener('resize', resizeCanvas);

  // Inicializar
  resizeCanvas();
  gameLoop();
</script>
</body>
</html>
